name=MIDIcontroller
version=3.3.0
author=Josh Nishikawa <joshnishikawa@gmail.com>
maintainer=Josh Nishikawa <joshnishikawa@gmail.com>
sentence=A cross-platform library for creating USB, Serial DIN, and multi-interface MIDI controllers.
paragraph=Supports Teensy, ESP32, RP2040, AVR, SAMD, and STM32. Includes support for momentary, latch, and trigger buttons (physical or capacitive touch), stable analog potentiometer conversion, velocity-sensitive drum/piezo inputs, capacitive touch expression strips, standard and multi-mode jogwheel encoders (MIDIencMulti), per-control channel/cable routing, and multi-interface output (USB, Serial DIN, USB Host, Debug).
category=Sensors
url=https://github.com/joshnishikawa/MIDIcontroller
architectures=*
depends=MIDI Library, Flicker, Bounce2, Encoder
